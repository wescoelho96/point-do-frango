name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linguagem: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.linguagem == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          queries: security-extended
      - name: Build
        if: matrix.linguagem == 'java-kotlin'
        run: ./mvnw -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v3

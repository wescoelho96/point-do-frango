# Produção (Render + Supabase). Todos os segredos vêm de variáveis de ambiente.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5         # o plano gratuito do Supabase limita conexões
      minimum-idle: 1

# Documentação da API só em desenvolvimento: em produção não expõe o mapa dos endpoints
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
